<style>
/* Layout: phone studio. Header, tab row, live analyzer, scrolling pane, player dock.
   Each tab has its own matte ground and one neon accent (set on body[data-tab]). */
:root{
  --bg:#1B1730; --card:#262042; --card2:#2F2850; --line:#3C3562;
  --fg:#EDEBF5; --mute:#AAA7C0; --acc:#22F3FF; --acc-ink:#04181B; --warn:#FF6B86;
  --f-ui:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body[data-tab="music"]{--bg:#1B1730;--card:#262042;--card2:#2F2850;--line:#3C3562;--acc:#22F3FF;--acc-ink:#04181B}
body[data-tab="eq30"]{--bg:#0A0A0C;--card:#15151A;--card2:#1E1E25;--line:#2D2D38;--acc:#22F3FF;--acc-ink:#04181B}
body[data-tab="cl16"]{--bg:#2A2C30;--card:#34373C;--card2:#3E4147;--line:#4C5058;--acc:#B6FF3B;--acc-ink:#121A02}
body[data-tab="inst"]{--bg:#1E2832;--card:#293541;--card2:#33414F;--line:#415163;--acc:#FF4FE0;--acc-ink:#220319}
body[data-tab="fx"]{--bg:#261C3D;--card:#31244E;--card2:#3B2C5E;--line:#4A3A75;--acc:#FFE600;--acc-ink:#231F00}
body[data-tab="pre"]{--bg:#2A2622;--card:#363029;--card2:#413A31;--line:#554C40;--acc:#FF9A1F;--acc-ink:#241400}
body[data-tab="vib"]{--bg:#2B1F22;--card:#38292D;--card2:#443439;--line:#5A4449;--acc:#FF5A5A;--acc-ink:#2A0606}
body[data-tab="gen"]{--bg:#1C2A27;--card:#263733;--card2:#30443F;--line:#416058;--acc:#B58CFF;--acc-ink:#150B2A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.35 var(--f-ui);
  display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{display:flex;align-items:center;gap:8px;padding-block:10px 8px;flex-wrap:wrap}
header.top h1{font-size:20px;font-weight:700;letter-spacing:.04em;margin:0;flex:1;min-width:96px;text-transform:uppercase}
header.top h1 span{color:var(--acc)}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:transparent;font-weight:600;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 15px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:600;letter-spacing:.02em}
.tab[aria-selected=true]{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
#viz{width:100%;height:96px;border-radius:14px;background:var(--card);display:block;margin-bottom:2px}
main{overflow-y:auto;padding-block:12px;display:flex;flex-direction:column;gap:12px;min-height:0;scrollbar-width:thin}
.pane{display:flex;flex-direction:column;gap:12px}
.pane[hidden]{display:none}
.card{background:var(--card);border-radius:14px;padding:12px 14px}
.card.locked .cbody{opacity:.5;pointer-events:none}
.chead{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.chead h2{font-size:17px;font-weight:700;margin:0;flex:1;min-width:120px;letter-spacing:.02em}
.hint{color:var(--mute);font-size:13px;margin:0 0 8px}
.mini{color:var(--mute);font-size:12px}
.sw{width:52px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center}
.sw i{display:block;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s,background .15s}
.sw[aria-checked=true] i{background:var(--acc)}
.sw[aria-checked=true] i::after{transform:translateX(20px);background:var(--acc-ink)}
.ib{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.ib[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* parameter row */
.prow{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl{font-weight:600}
.pv{display:flex;align-items:center;gap:4px}
.in{width:84px;min-height:40px;padding:0 8px;text-align:right;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:14px}
.u{color:var(--mute);font-size:12px;min-width:26px}
.pctl{display:flex;align-items:center;gap:4px}
.pctl input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--acc);margin:0}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:20px;line-height:1;flex:none;display:grid;place-items:center;padding:0}
.rst{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--mute);flex:none;font-size:18px;padding:0}
.adv{margin-top:2px}
.adv summary{min-height:36px;display:flex;align-items:center;color:var(--mute);font-size:13px;cursor:pointer}

/* band strips */
.strip{display:flex;overflow-x:auto;gap:2px;padding:8px 0 10px;scrollbar-width:thin;overscroll-behavior-x:contain}
.bcol{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bv{font-size:11px;color:var(--mute);height:15px}
.btrack{position:relative;width:34px;height:210px;touch-action:none;border-radius:9px;background:var(--card2)}
.bcol.sel .btrack{box-shadow:0 0 0 2px var(--acc)}
.bin{position:absolute;inset:9px 0}
.brail{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--line);border-radius:2px}
.bzero{position:absolute;left:3px;right:3px;top:50%;height:1px;background:var(--mute);opacity:.5}
.bfill{position:absolute;left:50%;width:4px;margin-left:-2px;background:var(--acc);border-radius:2px}
.bthumb{position:absolute;left:2px;right:2px;height:14px;margin-top:-7px;border-radius:7px;background:var(--fg);box-shadow:0 0 10px var(--acc)}
.bf{font-size:11px;color:var(--mute)}
.bn{font-size:10px;color:var(--mute);height:24px;overflow:hidden;text-align:center;line-height:1.1}
.fine{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.fnav{display:flex;align-items:center;gap:8px}
.fnav .mid{flex:1;text-align:center}
.fname{font-weight:700;font-size:16px}
.fval{font-size:22px;color:var(--acc)}
.frow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.frow .btn{min-width:52px;padding:0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* music */
.plist{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow-y:auto}
.pitem{min-height:44px;text-align:left;border:0;border-radius:10px;background:transparent;padding:0 10px;display:flex;align-items:center;gap:8px}
.pitem[aria-current=true]{background:var(--card2);color:var(--acc);font-weight:700}
.pitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.empty{color:var(--mute);padding:14px 4px;text-align:center}

/* presets */
.prrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.prrow:first-child{border-top:0}
.prn{flex:1;min-width:0;display:flex;flex-direction:column}
.prn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prn small{color:var(--mute);font-size:12px}
.field{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
textarea.field{min-height:110px;padding:10px 12px;font-family:var(--f-num);font-size:12px;resize:vertical}
.sub{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:6px 0 2px}
canvas.radar{width:132px;height:132px;display:block;margin:0 auto 4px;border-radius:50%;background:var(--card2)}

/* dock */
.dock{padding-block:8px 10px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.dt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
#dTitle{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#dTime{font-size:12px;color:var(--mute);flex:none}
#seek{width:100%;height:28px;margin:0;accent-color:var(--acc)}
.dc{display:flex;align-items:center;justify-content:center;gap:18px}
.tb{width:48px;height:48px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;padding:0;color:var(--fg)}
.tb svg{width:24px;height:24px;fill:currentColor}
.tb.play{width:56px;height:56px;background:var(--acc);color:var(--acc-ink)}
#toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:22px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const dB=x=>Math.pow(10,x/20);
const r1=v=>Math.round(v*10)/10;
const fmtF=f=>f>=1000?(+(f/1000).toFixed(2))+'k':String(f);
const fmtHz=f=>f>=1000?(+(f/1000).toFixed(2))+' kHz':f+' Hz';
const sgn=(v,d=1)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);
const mmss=t=>{t=Math.max(0,t|0);return (t/60|0)+':'+String(t%60).padStart(2,'0')};

/* ---------- datos ---------- */
const BANDS30=[25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
const BANDS16=[40,63,100,160,250,400,630,1000,1600,2500,4000,5000,8000,10000,12500,16000];
const NAMES16=['Sub','Graves','Bajos','Cuerpo','Calidez','Barro','Medios','Voz','Claridad','Nitidez','Dicción','Brillo','Agudos','Aire','Aire +','Ultra'];
const INST=[
 {grp:'drums',name:'Batería',items:[['kick','Bombo',60,1.2],['snareB','Caja · cuerpo',200,1.4],['snareC','Caja · chasquido',5000,1.2],['tomF','Tom de piso',90,1.5],['tomM','Tom medio',160,1.5],['tomH','Tom agudo',250,1.5],['hat','Hi-hat',9000,1],['cym','Platillos',12000,0.8]]},
 {grp:'guitar',name:'Guitarras',items:[['gBody','Guitarra · cuerpo',250,1.2],['gPres','Guitarra · presencia',3000,1.2],['gAc','Acústica · brillo',6000,1]]},
 {grp:'bass',name:'Bajo',items:[['bLow','Bajo · cuerpo',80,1.4],['bAtk','Bajo · ataque',900,1.4]]},
 {grp:'voice',name:'Voces',items:[['vWarm','Voz · calidez',200,1.2],['vPres','Voz · presencia',3500,1.2],['vSib','Voz · sibilancia',7000,2],['vAir','Voz · aire',12000,0.8]]},
 {grp:'keys',name:'Teclas y piano',items:[['kBody','Piano · cuerpo',300,1.2],['kBri','Piano · brillo',4500,1]]}
];
const FXN={tone:'Tono y filtros',comp:'Compresor',sat:'Saturación',wid:'Ancho estéreo',rev:'Reverberación',dly:'Eco / Delay',sp:'Sonido 3D',sub:'Subgraves potentes',glass:'Resonancia de vidrios',harm:'Armónicos de graves',trem:'Temblor (trémolo)',vibr:'Vibrato',hap:'Vibración del teléfono'};

function defState(){
  const inst={};INST.forEach(g=>g.items.forEach(([id,,f,q])=>inst[id]={g:0,f,q}));
  return {master:{pre:0,vol:0},q30:4.32,r30:12,eq:Array(30).fill(0),q16:2.8,r16:12,cl:Array(16).fill(0),inst,
    fx:{tone:{bass:0,bassF:100,treb:0,trebF:8000,lc:20,hc:20000},
      comp:{on:false,th:0,ratio:1,attack:3,release:250,knee:0,makeup:0},
      sat:{on:false,drive:0,mix:0},wid:{on:false,w:0},
      rev:{on:false,mix:0,decay:2,pre:0,damp:30,size:50},
      dly:{on:false,time:250,fb:0,mix:0,tone:8000},
      sp:{on:false,mix:0,az:0,el:0,dist:1,rot:0},
      sub:{on:false,freq:50,g:0,q:1.2},glass:{on:false,freq:90,g:0,q:6},harm:{on:false,freq:120,drive:0,mix:0},
      trem:{on:false,rate:5,depth:0,shape:0},vibr:{on:false,rate:5,depth:0},
      hap:{on:false,thr:60,dur:40,gap:60,shake:0}},
    bypass:false,locks:{}};
}
let S=defState();const D=defState();
function merge(t,s){if(!s||typeof s!=='object')return;for(const k in t){if(!(k in s))continue;if(t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))merge(t[k],s[k]);else if(typeof t[k]===typeof s[k]&&!Array.isArray(t[k]))t[k]=s[k]}}
const SEC={
  master:{n:'Entrada y salida',get:s=>clone(s.master),set:(s,d)=>merge(s.master,d)},
  eq30:{n:'EQ de 30 bandas',get:s=>({eq:s.eq.slice(),q30:s.q30,r30:s.r30}),set:(s,d)=>{if(d&&Array.isArray(d.eq)&&d.eq.length===30)s.eq=d.eq.map(v=>clamp(+v||0,-24,24));if(d&&+d.q30)s.q30=+d.q30;if(d&&+d.r30)s.r30=+d.r30}},
  cl16:{n:'16 bandas de claridad',get:s=>({cl:s.cl.slice(),q16:s.q16,r16:s.r16}),set:(s,d)=>{if(d&&Array.isArray(d.cl)&&d.cl.length===16)s.cl=d.cl.map(v=>clamp(+v||0,-24,24));if(d&&+d.q16)s.q16=+d.q16;if(d&&+d.r16)s.r16=+d.r16}}
};
INST.forEach(g=>SEC[g.grp]={n:g.name,get:s=>{const o={};g.items.forEach(([id])=>o[id]=clone(s.inst[id]));return o},set:(s,d)=>{if(d)g.items.forEach(([id])=>{if(d[id])merge(s.inst[id],d[id])})}});
Object.keys(FXN).forEach(k=>SEC[k]={n:FXN[k],get:s=>clone(s.fx[k]),set:(s,d)=>merge(s.fx[k],d)});
const ORDER=['master','eq30','cl16','drums','guitar','bass','voice','keys','tone','comp','sat','wid','rev','dly','sp','sub','glass','harm','trem','vibr','hap'];
const getFull=()=>{const o={};ORDER.forEach(k=>o[k]=SEC[k].get(S));return o};
const resetSec=k=>SEC[k].set(S,SEC[k].get(D));

/* ---------- almacenamiento ---------- */
const KEY='estudio-eq-v1';
let store={last:null,presets:[],sec:{}};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object'){store.last=o.last||null;store.presets=Array.isArray(o.presets)?o.presets:[];store.sec=o.sec&&typeof o.sec==='object'?o.sec:{}}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){toast('Este navegador no permite guardar. Usa Exportar en Presets.');return false}}
let saveT;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{store.last={data:getFull(),bypass:S.bypass,locks:S.locks};persist()},500)}
if(store.last&&store.last.data){ORDER.forEach(k=>{if(store.last.data[k])SEC[k].set(S,store.last.data[k])});S.bypass=!!store.last.bypass;S.locks=store.last.locks&&typeof store.last.locks==='object'?store.last.locks:{}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
const stamp=()=>new Date().toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

/* ---------- audio ---------- */
let ctx=null,audio=null,N={},irKey='',irT=0,satDrive=-1,harmDrive=-1,vizDirty=true;
const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1])};
function build(){
  const AC=window.AudioContext||window.webkitAudioContext;
  audio=new Audio();audio.setAttribute('playsinline','');audio.preload='auto';
  if(!AC){toast('Este navegador no admite audio avanzado.');return}
  ctx=new AC();
  const src=ctx.createMediaElementSource(audio);
  const g=(v=1)=>{const n=ctx.createGain();n.gain.value=v;return n};

let lastVib=0,warnedVib=false,shakeAmt=0;
function hapticTick(now){
  const hp=S.fx.hap,els=[$('#viz'),$('.dock')];
  const clr=()=>{shakeAmt=0;els.forEach(e=>{if(e)e.style.transform=''})};
  if(!hp.on||!ctx||!freqData||audio.paused){if(shakeAmt)clr();return}
  const bin=ctx.sampleRate/2/freqData.length,a=Math.floor(20/bin),b=Math.ceil(150/bin);let m=0,n=0;
  for(let k=a;k<=b&&k<freqData.length;k++){m+=freqData[k];n++}
  const lvl=n?m/n/255:0,thr=hp.thr/100;
  if(lvl>thr){
    const amt=(lvl-thr)/(1-thr+1e-6);
    if(hp.shake>0){shakeAmt=amt*hp.shake/100*7;els.forEach(e=>{if(e)e.style.transform='translate('+((Math.random()*2-1)*shakeAmt).toFixed(1)+'px,'+((Math.random()*2-1)*shakeAmt).toFixed(1)+'px)'})}
    if(typeof navigator.vibrate==='function'){if(now-lastVib>hp.gap+hp.dur){lastVib=now;try{navigator.vibrate(Math.round(hp.dur*(0.5+amt*0.5)))}catch(e){}}}
    else if(!warnedVib){warnedVib=true;toast('Este navegador no permite vibrar el teléfono; queda el temblor de pantalla.')}
  }else if(shakeAmt)clr();
}
