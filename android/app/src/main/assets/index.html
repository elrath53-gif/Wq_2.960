<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Estudio EQ</title>
<meta name="theme-color" content="#03020A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio EQ">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #05030F;
  --card: rgba(255, 255, 255, 0.06);
  --card2: rgba(255, 255, 255, 0.055);
  --line: rgba(255, 255, 255, 0.18);
  --fg: #F9FAFF;
  --mute: #BDB8DA;
  --acc: #00E5FF;
  --acc2: #A855F7;
  --acc3: #FF2A85;
  --acc-ink: #03151A;
  --warn: #FF6B86;
  --f-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
  box-sizing: border-box;
}

[hidden]:not([hidden="until-found"]) {
  display: none !important;
}

/* Secciones Prisma 01 · Notificaciones Flotantes de Humo / Cristal */
body[data-tab="music"] { --acc: #00E5FF; --acc2: #A855F7; --acc3: #FF2A85; --acc-ink: #03151A; }
body[data-tab="eq30"]  { --bg: #030613; --acc: #5CEEFF; --acc2: #818CF8; --acc3: #F472B6; --acc-ink: #02161E; }
body[data-tab="cl16"]  { --acc: #4DFF9E; --acc2: #00E5FF; --acc3: #C084FC; --acc-ink: #021C0E; }
body[data-tab="inst"]  { --acc: #FF55D8; --acc2: #9D4EDD; --acc3: #00E5FF; --acc-ink: #1F0318; }
body[data-tab="fx"]    { --acc: #22F3FF; --acc2: #A855F7; --acc3: #FF2A85; --acc-ink: #03161A; }
body[data-tab="vib"]   { --acc: #FF3B9A; --acc2: #9D4EDD; --acc3: #00E5FF; --acc-ink: #220312; }
body[data-tab="gen"]   { --acc: #C084FC; --acc2: #00E5FF; --acc3: #FF2A85; --acc-ink: #140626; }
body[data-tab="pre"]   { --acc: #38F9D7; --acc2: #A855F7; --acc3: #FF2A85; --acc-ink: #031B16; }

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  max-width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  position: relative;
  background-color: var(--bg);
  color: var(--fg);
  font: 500 15px/1.42 var(--f-ui);
  transition: background-color 0.25s ease;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

/* Nubes volumétricas de humo y plasma detrás de los recuadros transparentes */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 72% 34% at 14% 18%, rgba(0, 229, 255, 0.28), transparent 66%),
    radial-gradient(ellipse 68% 34% at 88% 24%, rgba(255, 42, 133, 0.24), transparent 68%),
    radial-gradient(ellipse 76% 36% at 20% 52%, rgba(168, 85, 247, 0.25), transparent 68%),
    radial-gradient(ellipse 70% 34% at 82% 66%, rgba(0, 229, 255, 0.20), transparent 68%),
    radial-gradient(ellipse 80% 38% at 38% 88%, rgba(255, 79, 163, 0.20), transparent 72%);
}

/* Distinción sutil de humo zafiro-índigo-orquídea en EQ 30 */
body[data-tab="eq30"]::before {
  background:
    radial-gradient(ellipse 74% 36% at 18% 16%, rgba(56, 189, 248, 0.30), transparent 66%),
    radial-gradient(ellipse 68% 34% at 86% 26%, rgba(129, 140, 248, 0.27), transparent 68%),
    radial-gradient(ellipse 76% 36% at 24% 56%, rgba(56, 249, 215, 0.20), transparent 68%),
    radial-gradient(ellipse 72% 34% at 80% 70%, rgba(244, 114, 182, 0.22), transparent 68%),
    radial-gradient(ellipse 80% 38% at 42% 90%, rgba(92, 238, 255, 0.22), transparent 72%);
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    linear-gradient(125deg,
      transparent 8%,
      rgba(220, 235, 255, 0.06) 24%,
      transparent 40%,
      rgba(192, 132, 252, 0.08) 58%,
      transparent 74%,
      rgba(0, 229, 255, 0.06) 90%);
}

input,
textarea {
  user-select: text;
  -webkit-user-select: text;
}

#root {
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  position: relative;
  z-index: 1;
}

/* Estructura Prisma 01 · Zen Flotante 100% adaptable a móviles y escritorio */
.studio-shell {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas:
    "top"
    "viz"
    "main"
    "tabs";
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

.num {
  font-family: var(--f-num);
  font-variant-numeric: tabular-nums;
}

.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- Cabecera compacta de 1 línea en móvil y escritorio ---------- */
header.top {
  grid-area: top;
  width: 100%;
  max-width: 1120px;
  min-width: 0;
  margin-inline: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px));
  flex-wrap: nowrap;
}

header.top h1 {
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  margin: 0;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-transform: uppercase;
  color: #FFFFFF;
  text-shadow: 0 0 18px rgba(0, 229, 255, 0.30);
}

header.top h1 span {
  color: var(--acc);
  font-weight: 500;
}

header.top .btn {
  min-height: 38px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

header.top .btn.pri {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(0, 229, 255, 0.14));
  color: #ECFEFF;
  border: 1px solid rgba(255, 255, 255, 0.30);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.32);
}

/* ---------- Botones y Chips de Humo Traslúcido ---------- */
.btn {
  min-height: 44px;
  padding: 0 15px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.20);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.095) 0%, rgba(255, 255, 255, 0.03) 100%);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.24);
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  max-width: 100%;
  transition: background 0.16s, border-color 0.16s, transform 0.14s;
}

.btn:active,
.chip:active,
.ib:active,
.step:active {
  transform: scale(0.97);
}

.btn.pri {
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.22) 0%, rgba(255, 255, 255, 0.10) 50%, rgba(168, 85, 247, 0.20) 100%);
  color: #F6FFFF;
  border: 1px solid rgba(0, 229, 255, 0.55);
  font-weight: 600;
  box-shadow: 0 8px 22px rgba(0, 229, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.38);
}

.btn.ghost {
  background: rgba(255, 255, 255, 0.035);
  border-color: rgba(255, 255, 255, 0.15);
  box-shadow: none;
}

.btn.sm {
  min-height: 38px;
  padding: 0 12px;
  font-size: 13px;
}

.chip {
  min-height: 40px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.025) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.20);
  font-weight: 500;
  font-size: 13px;
  color: #D2CEE9;
  white-space: nowrap;
  max-width: 100%;
  transition: background 0.16s, color 0.16s, border-color 0.16s, transform 0.14s;
}

.chip[aria-pressed="true"] {
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.20) 0%, rgba(255, 255, 255, 0.09) 100%);
  color: #FFFFFF;
  border-color: var(--acc);
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.34);
}

/* ---------- Barra de Navegación Flotante tipo Humo ---------- */
.tabs {
  grid-area: tabs;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  display: flex;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.085) 0%, rgba(12, 10, 28, 0.56) 100%);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border-top: 1px solid rgba(255, 255, 255, 0.22);
  box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  gap: 4px;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex: 1 0 66px;
  min-height: 50px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 15px;
  background: transparent;
  color: #B4AFD3;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.01em;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  white-space: nowrap;
  transition: color 0.16s, background 0.16s, border-color 0.16s;
}

.tab-ico {
  display: inline-flex;
  width: 20px;
  height: 20px;
}

.tab-ico svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab[aria-selected="true"] {
  color: #FFFFFF;
  font-weight: 600;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
  border-color: rgba(255, 255, 255, 0.22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
}

.tab[aria-selected="true"] .tab-ico {
  color: var(--acc);
  filter: drop-shadow(0 0 9px var(--acc));
}

/* ---------- Analizador (#viz) ---------- */
#viz {
  grid-area: viz;
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 94px;
  background: transparent;
  border-radius: 0;
}

/* ---------- Área Principal y Recuadros Flotantes de Humo Transparente ---------- */
main {
  grid-area: main;
  width: 100%;
  max-width: 1120px;
  min-width: 0;
  min-height: 0;
  margin-inline: auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
}

.pane {
  width: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.pane[hidden] {
  display: none;
}

/* Reproductor (.dock) exclusivo de la primera pestaña (Música) */
body:not([data-tab="music"]) .dock {
  display: none !important;
}

.dock {
  width: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 16px 18px 14px;
  gap: 8px;
  border-radius: 24px;
  background:
    radial-gradient(125% 95% at 15% 0%, rgba(0, 229, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 50%, transparent 78%),
    linear-gradient(155deg, rgba(235, 240, 255, 0.10) 0%, rgba(185, 195, 245, 0.035) 52%, rgba(255, 255, 255, 0.06) 100%);
  backdrop-filter: blur(14px) saturate(145%);
  -webkit-backdrop-filter: blur(14px) saturate(145%);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-top-color: rgba(255, 255, 255, 0.38);
  box-shadow:
    0 16px 36px rgba(0, 0, 0, 0.32),
    inset 0 1px 1px rgba(255, 255, 255, 0.32),
    inset 0 0 32px rgba(255, 255, 255, 0.035);
}

.card {
  width: 100%;
  min-width: 0;
  border-radius: 24px;
  padding: 18px 20px;
  background:
    radial-gradient(125% 95% at 10% 0%, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 48%, transparent 75%),
    linear-gradient(155deg, rgba(235, 240, 255, 0.095) 0%, rgba(185, 195, 245, 0.035) 50%, rgba(255, 255, 255, 0.06) 100%);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-top-color: rgba(255, 255, 255, 0.38);
  border-left-color: rgba(255, 255, 255, 0.28);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.34),
    inset 0 1px 1px rgba(255, 255, 255, 0.32),
    inset 0 -1px 1px rgba(255, 255, 255, 0.08),
    inset 0 0 36px rgba(255, 255, 255, 0.04);
}

/* Matiz sutil Zafiro-Cristal en EQ 30 manteniendo la transparencia de humo flotante */
body[data-tab="eq30"] .card {
  border-radius: 22px;
  background:
    radial-gradient(130% 95% at 12% 0%, rgba(125, 232, 255, 0.15) 0%, rgba(129, 140, 248, 0.04) 50%, transparent 78%),
    linear-gradient(155deg, rgba(220, 242, 255, 0.10) 0%, rgba(150, 175, 255, 0.04) 52%, rgba(244, 114, 182, 0.055) 100%);
  border-color: rgba(145, 225, 255, 0.24);
  border-top-color: rgba(185, 245, 255, 0.44);
  border-left-color: rgba(165, 230, 255, 0.32);
}

.cbody {
  width: 100%;
  min-width: 0;
}

.card.locked .cbody {
  opacity: 0.48;
  pointer-events: none;
}

.chead {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  min-width: 0;
}

.chead h2 {
  font-size: 17.5px;
  font-weight: 600;
  margin: 0;
  flex: 1;
  min-width: 120px;
  letter-spacing: -0.01em;
  color: #FFFFFF;
}

.cacts {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.hint {
  color: var(--mute);
  font-size: 13.5px;
  line-height: 1.5;
  margin: 0 0 10px;
}

.mini {
  color: var(--mute);
  font-size: 12px;
  line-height: 1.45;
}

/* Interruptores flotantes de humo */
.sw {
  width: 48px;
  height: 44px;
  border: 0;
  background: none;
  padding: 0;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.sw i {
  display: block;
  width: 44px;
  height: 25px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.24);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
  position: relative;
  transition: background 0.18s, box-shadow 0.18s, border-color 0.18s;
}

.sw i::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 3px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  transition: transform 0.18s, background 0.18s;
}

.sw[aria-checked="true"] i {
  background: linear-gradient(90deg, rgba(0, 229, 255, 0.42) 0%, rgba(168, 85, 247, 0.48) 100%);
  border-color: var(--acc);
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.34);
}

.sw[aria-checked="true"] i::after {
  transform: translateX(17px);
  background: #FFFFFF;
  box-shadow: 0 0 10px var(--acc);
}

/* Botones de acción de tarjeta (.ib) tipo cápsula de humo */
.ib {
  min-height: 38px;
  min-width: 44px;
  padding: 0 11px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.025) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  font-weight: 500;
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: #E2DFF5;
  white-space: nowrap;
}

.ib[aria-pressed="true"] {
  border-color: var(--acc);
  color: #FFFFFF;
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.18), rgba(255, 255, 255, 0.06));
  box-shadow: 0 0 14px rgba(0, 229, 255, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.28);
}

.ib svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* ---------- Filas de Parámetros y Deslizadores ---------- */
.prow {
  width: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.10);
}

.prow:first-of-type {
  border-top: 0;
}

.ptop {
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.pl {
  font-weight: 500;
  font-size: 14.5px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pv {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.in {
  width: 78px;
  min-height: 38px;
  padding: 0 7px;
  text-align: right;
  border-radius: 11px;
  border: 1px solid rgba(255, 255, 255, 0.20);
  background: rgba(255, 255, 255, 0.065);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.20);
  font-size: 13.5px;
}

.u {
  color: var(--mute);
  font-size: 12px;
  min-width: 22px;
}

.pctl {
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.pctl input[type="range"],
.rfull {
  flex: 1;
  width: 100%;
  min-width: 0;
  height: 44px;
  accent-color: var(--acc);
  margin: 0;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
}

#seek {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
}

.pctl input[type="range"]::-webkit-slider-runnable-track,
.rfull::-webkit-slider-runnable-track {
  height: 5px;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    #00E5FF 0%,
    var(--acc) calc(var(--p, 50%) * 0.55),
    #FF6AC2 var(--p, 50%),
    rgba(255, 255, 255, 0.16) var(--p, 50%),
    rgba(255, 255, 255, 0.16) 100%
  );
}

.pctl input[type="range"]::-webkit-slider-thumb,
.rfull::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  margin-top: -6.5px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 2px solid var(--acc);
  box-shadow: 0 0 12px var(--acc);
}

#seek::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    #00E5FF 0%,
    #A855F7 calc(var(--p, 0%) * 0.65),
    #FF4FA3 var(--p, 0%),
    rgba(255, 255, 255, 0.16) var(--p, 0%),
    rgba(255, 255, 255, 0.16) 100%
  );
}

#seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  margin-top: -5px;

    {

    $("#bNext").addEventListener("click", () => nextTrack(false));

    });
    audio.addEventListener("play", () => {
      userWantsPlaying = true;
      clearTimeout(resumeT);

      if (ic) ic.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      $("#bPlay").setAttribute("aria-label", "Pausar");
      updateEngineSpecUi();
      syncMediaSession(true);

    audio.addEventListener("pause", () => {
      if (userWantsPlaying && !audio.ended) {
        if (inPhoneCall()) {
          userWantsPlaying = false;

          clearTimeout(resumeT);
          resumeT = setTimeout(() => {
            if (!userWantsPlaying || !audio.paused || audio.ended || inPhoneCall()) return;

            });

            });

        }

      updSeekPct();
